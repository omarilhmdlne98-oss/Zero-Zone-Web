<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zero-Zone — Web-Native 3D Multiplayer</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070a0f; color: #eef2f6; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    #game-canvas { display: block; width: 100vw; height: 100vh; }

    /* Lobby Overlay */
    #lobby {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
      background: radial-gradient(circle at center, rgba(16, 26, 40, 0.88), rgba(7, 10, 15, 0.96));
      padding: 16px;
    }
    .lobby-card {
      width: 100%; max-width: 420px; background: #111822; border: 1px solid #2b3a4f;
      border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .lobby-card h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; color: #38e2ff; text-align: center; }
    .lobby-card label { font-size: 0.82rem; color: #9fb0c4; }
    .lobby-card input, .lobby-card select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3b50;
      background: #0a0f16; color: #f0f4f8; font-size: 0.95rem;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; background: linear-gradient(135deg, #2be0ff, #1789c7); color: #051018;
    }

    /* HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: none; }
    .hud-top {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .hud-box {
      background: rgba(11, 16, 24, 0.78); border: 1px solid rgba(56, 226, 255, 0.3);
      border-radius: 10px; padding: 8px 12px; min-width: 150px;
    }
    .bar-bg { width: 100%; height: 8px; background: #1b2533; border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; transition: width 0.12s linear; }
    .hp-fill { background: #34d399; }
    .stam-fill { background: #38bdf8; }
    .cd-fill { background: #a855f7; }
    .vault-fill { background: #f59e0b; }
    .crosshair {
      position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); border: 2px solid rgba(56, 226, 255, 0.85); border-radius: 50%;
    }
    .hud-bottom-left { position: absolute; bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 6px; width: 220px; }
    .hint { font-size: 0.75rem; color: #9fb0c4; }

    /* Mobile Touch Controls */
    #touch-controls { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: none; }
    .joy-zone {
      position: absolute; bottom: 24px; width: 124px; height: 124px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(56,226,255,0.35); pointer-events: auto;
    }
    #joy-move { left: 22px; }
    #joy-look { right: 22px; bottom: 154px; width: 104px; height: 104px; }
    .joy-knob {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
      transform: translate(-50%, -50%); border-radius: 50%; background: rgba(56,226,255,0.65);
    }
    .touch-actions {
      position: absolute; right: 20px; bottom: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto;
    }
    .t-btn {
      width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
      background: rgba(15, 23, 34, 0.78); color: #fff; font-weight: 800; font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="lobby">
    <div class="lobby-card">
      <h1>ZERO-ZONE</h1>
      <div>
        <label for="kit-select">Operator Kit</label>
        <select id="kit-select">
          <option value="vanguard">Vanguard (Cyan / Dash)</option>
          <option value="spectre">Spectre (Violet / Cloak)</option>
          <option value="juggernaut">Juggernaut (Amber / Shield)</option>
        </select>
      </div>
      <div>
        <label for="room-input">Room ID</label>
        <input id="room-input" value="alpha" />
      </div>
      <div>
        <label for="ws-input">WebSocket Server URL (Optional)</label>
        <input id="ws-input" value="" placeholder="Leave blank for Solo / AI Bot Arena" />
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-play" type="button">Deploy to Arena</button>
      </div>
      <div class="hint" id="lobby-status">Desktop: WASD + Mouse + Space/Shift/E/F | Mobile: Auto Touch Controls</div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-box">
        <div style="font-size:0.82rem;font-weight:700;" id="hud-timer">05:00</div>
        <div class="hint" id="hud-room">Room: alpha</div>
      </div>
      <div class="hud-box" style="min-width:210px;">
        <div style="font-size:0.8rem;font-weight:700;" id="hud-vault-text">Vault Breach: 0 / 20s</div>
        <div class="bar-bg"><div class="bar-fill vault-fill" id="hud-vault-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="crosshair"></div>

    <div class="hud-bottom-left hud-box">
      <div style="font-size:0.78rem;" id="hud-hp-text">HP: 100</div>
      <div class="bar-bg"><div class="bar-fill hp-fill" id="hud-hp-bar" style="width:100%"></div></div>
      <div style="font-size:0.78rem;" id="hud-stam-text">Stamina: 100</div>
      <div class="bar-bg"><div class="bar-fill stam-fill" id="hud-stam-bar" style="width:100%"></div></div>
      <div style="font-size:0.78rem;" id="hud-cd-text">Ability [E]: Ready</div>
      <div class="bar-bg"><div class="bar-fill cd-fill" id="hud-cd-bar" style="width:100%"></div></div>
      <div class="hint">[F] Hold near Vault to Breach</div>
    </div>
  </div>

  <div id="touch-controls">
    <div class="joy-zone" id="joy-move"><div class="joy-knob" id="knob-move"></div></div>
    <div class="joy-zone" id="joy-look"><div class="joy-knob" id="knob-look"></div></div>
    <div class="touch-actions">
      <button class="t-btn" id="t-fire" type="button">FIRE</button>
      <button class="t-btn" id="t-jump" type="button">JUMP</button>
      <button class="t-btn" id="t-ability" type="button">ABL</button>
      <button class="t-btn" id="t-breach" type="button">VAULT</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
